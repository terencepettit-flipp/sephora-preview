    <script>
      // Runs before the Flipp SDK loads. The SDK requests data with XHR, so requests are rerouted at open()
      // to prepared blob responses. The SDK's Curator calls (hardcoded to dev-api) are answered from the
      // publication this page already fetched through the DVM previews proxy.
      (() => {
        const CURATOR = "https://dev-api.flipp.com/curator/v2/publications";
        window.__flyerRouting = null; // { configBlob, merchantBlob, storeBlob, listBlob, publicationBlob }

        function route(raw) {
          const r = window.__flyerRouting;
          if (!r || !raw) return raw;
          let url;
          try { url = new URL(String(raw), location.href); } catch { return raw; }
          const path = url.origin + url.pathname.replace(/\/$/, "");

          if (/^https:\/\/aq\.flippenterprise\.net\/\d+\/config\.json$/.test(path)) return r.configBlob || raw;
          if (path.startsWith("https://dam.flippenterprise.net/hosted/merchant/")) return r.merchantBlob || raw;
          if (path.startsWith("https://dam.flippenterprise.net/hosted/store/")) return r.storeBlob || raw;
          if (path === CURATOR) return r.listBlob;
          if (path.startsWith(CURATOR + "/")) return r.publicationBlob;
          return raw;
        }

        const origOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          return origOpen.call(this, method, route(url), ...rest);
        };

        const origFetch = window.fetch;
        window.fetch = function (input, init) {
          const isUrl = typeof input === "string" || input instanceof URL;
          return origFetch.call(this, isUrl ? route(input) : input, init);
        };
      })();
    </script>

    <style>
      :root {
        --bg: #0b0f17;
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.68);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(1200px 600px at 20% 0%, rgba(104, 156, 255, 0.12), transparent 50%),

          var(--bg);
      }

      .wrap { width: 80%; margin: 0 auto; padding: 18px 0; }

      .hint { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }

      @media (max-width: 900px) {

      const FIELDS = ["globalId", "merchantId", "storeCode", "templateUrl"];
      // Hardcoded flyer parameters (no URL query string needed). Query params, if present, still override.
      const params = new URLSearchParams({
        globalId: "01M7B8CYFGX032DETDF7RMHXZ7",
        merchantId: "757",
        storeCode: "894",
      });
      for (const [k, v] of new URLSearchParams(location.search)) params.set(k, v);
      const merchantNameIdentifier = params.get("merchantNameIdentifier") || "";
      const $ = (id) => document.getElementById(id);

      // Global ID picker: reloads the page with ?globalId=..., which the Curator call then uses.
      $("globalIdInput").value = params.get("globalId") || "";
      $("templateUrlInput").value = params.get("templateUrl") || "";
      $("picker").addEventListener("submit", (e) => {
        e.preventDefault();
        const id = $("globalIdInput").value.trim();
        if (!id) return;
        const q = new URLSearchParams(location.search);
        q.set("globalId", id);
        const tpl = $("templateUrlInput").value.trim();
        if (tpl) q.set("templateUrl", tpl); else q.delete("templateUrl");
        location.search = q.toString();
      });

      function setStatus(kind, text) {
        $("hint").className = kind ? `hint ${kind}` : "hint";
        $("hint").textContent = text;
      }

      function readInputs() {
        return Object.fromEntries(FIELDS.map((f) => [f, (params.get(f) || "").trim()]));
      }

      function buildPublicationUrl({ globalId, merchantId, storeCode }) {
        const url = new URL(`${CURATOR_BASE}/${encodeURIComponent(globalId)}`);
        url.searchParams.set("merchantId", merchantId);
        url.searchParams.set("storeCode", storeCode);
        url.searchParams.set("renderingMetadataType", "RENDERING_METADATA_TYPE_DVM_TEMPLATE");
        //url.searchParams.set("includeUpcoming", "true");
        return url;
      }

      // Shape the single-publication response like an item from the publications list.
      function toListItem(pub) {
        const { sections, rendering, storeMetadata, ...rest } = pub;
        return { categories: [], ...rest, renderingMetadataTypes: ["DVM_TEMPLATE"] };
      }

      let routingBlobs = [];
      const jsonBlob = (data) => {
        const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: "application/json" }));
        routingBlobs.push(url);
        return url;
      };

      const fetchOk = (url) => fetch(url).then((r) => (r.ok ? r : null), () => null);

      async function buildRouting({ merchantId, storeCode, templateUrl }, body, nameIdentifier) {
        const pub = body.publication;
        window.__flyerRouting = null;
        routingBlobs.forEach(URL.revokeObjectURL);
        routingBlobs = [];

        const dam = "https://dam.flippenterprise.net/hosted";
        const auth = `locale=en&access_token=${encodeURIComponent(ACCESS_TOKEN)}`;
        const id = encodeURIComponent(nameIdentifier);

        const [cfgResp, merchantResp, storeResp] = await Promise.all([
          fetchOk(`https://aq.flippenterprise.net/${encodeURIComponent(merchantId)}/config.json`),
          fetchOk(`${dam}/merchant/${id}?${auth}`),
          fetchOk(`${dam}/store/${id}?${auth}&store_code=${encodeURIComponent(storeCode)}`),
        ]);

        const cfg = cfgResp ? await cfgResp.json() : {};
        cfg.integrations = { ...(cfg.integrations || {}), publicationFeedStrategy: "CURATOR_ONLY", isDvmEnabled: true };

        // Merchant and store lookups only succeed with the identifier that matches the token; otherwise stand in.
        const merchantBlob = merchantResp ? null : jsonBlob({
          name_identifier: nameIdentifier,
          name: `Merchant ${merchantId}`,
          country: "US",
          logo_url: "",
        });
        const storeName = (pub.storeMetadata && pub.storeMetadata.name) || `Store ${storeCode}`;
        const storeBlob = storeResp ? null : jsonBlob({
          id: 0,
          name: storeName,
          merchant_store_code: storeCode,
          postal_code: "",
          address: "",
          city: "",
        });

        return {
          configBlob: jsonBlob(cfg),
          merchantBlob,
          storeBlob,
          listBlob: jsonBlob({ publications: [toListItem(pub)], total: 1, publicationPlaces: [] }),
          publicationBlob: jsonBlob(
            templateUrl
              ? { ...body, publication: { ...pub, rendering: { ...pub.rendering, renderingMetadataType: "DVM_TEMPLATE", templateUrl } } }
              : body
          ),
        };
      }

      const amount = (v) => { const n = parseFloat(String(v || "").replace(/[^0-9.\-]/g, "")); return Number.isFinite(n) ? n : null; };

      // Rows with no SKU or a non-positive original price are skipped by ingestion.
      const skipRow = (r) => { const p = amount(r["Original Price"]); return !String(r.SKU || "").trim() || p === null || p <= 0; };

      function buildAtom(row, merchantId, storeCode, dates) {
        const price = amount(row["Original Price"]);
        let sale = amount(row["Sale Price"]);
        if (sale === null || sale <= 0 || sale > price) sale = price;
        const labels = String(row.Badges || "").split(",").map((b) => b.trim()).filter(Boolean)
          .map((b) => b.replace(/^badge:/, "")).filter((b, i, a) => a.indexOf(b) === i);
        const tags = [DEFAULT_TAG, row["DVM Tags"]].map((t) => String(t || "").trim()).filter(Boolean);
        const id = `dvm-${row.SKU}-${row.Rank}`;
        const urlEn = row["Product URL EN"];
        const urlFr = row["Product URL FR"] || urlEn;
        const locale = (name, desc, url) => ({
          name, description: truncate(String(desc || ""), 500), imageUrl: row["Image URL"],
          additionalInfo: {}, additionalMedia: [], ttmUrl: url,
        });
        const en = locale(row["Name EN"], row["Description EN"], urlEn);
        const fr = locale(row["Name FR"], row["Description FR"], urlFr);
        const pricing = { offerType: "UNSPECIFIED", price, salePrice: sale, conditionType: "UNSPECIFIED", purchaseMethods: ["ONLINE"], originalPriceEach: false, labels };
        if (sale < price) {
          pricing.offerType = "SPECIFIED_PRICE";
          pricing.amountOff = Math.round((price - sale) * 100) / 100;
          pricing.percentOff = Math.round((1 - sale / price) * 100);
        }
        const productId = `${id}-product`;
        return {
          details: en, globalId: id, labels, ttmUrl: urlEn, dates,
          offer: {
            globalId: id, merchantId: Number(merchantId),
            products: [{
              globalId: productId, merchantId: Number(merchantId),
              additionalIds: { sku: row.SKU },
              metadata: { onlineUrl: urlEn, brandText: row.Brand },
              categories: { googleCategories: [], merchantCategories: [] },
              details: { en, fr }, productDetails: {}, contentSource: "datafeed",
            }],
            productIds: [productId], distributionContext: {}, dates, pricing,
            categories: { googleCategories: [], merchantCategories: [] },
            metadata: { ttmUrl: urlEn, brands: row.Brand ? [row.Brand] : [], externalRef: row.SKU, brandIds: [], tags, customerRank: row.Rank || undefined },
            offerDetails: { disclaimer: DISCLAIMER_EN, saleStory: String(row["Sale Story EN"] || "").trim(), prePriceText: "", postPriceText: "", keywords: [] },
            details: en, language: "en", contentSource: "datafeed", integrations: [],
            legacyIds: { merchant: { merchantItemId: productId, storeCode: String(storeCode) } },
          },
          externalRef: row.SKU,
        };
      }

      function injectAtoms(pub, { merchantId, storeCode }) {
        const norm = (s) => String(s || "").trim().toLowerCase();
        for (const section of pub.sections || []) {
          const name = norm(section.details && section.details.name);
          const rows = DATASHEET.filter((r) => !skipRow(r) && name.startsWith(norm(r.Category)))
            .sort((a, b) => Number(a.Rank) - Number(b.Rank));
          if (!rows.length) continue;
          section.atoms = (section.atoms || []).concat(rows.map((r) => buildAtom(r, merchantId, storeCode, pub.dates)));
          console.log(`Injected ${rows.length} atoms into "${section.details.name}"`);
        }
      }

      // ---- Publication normalisation -------------------------------------------------------------------

      // Curator returns promotion atoms (blocks with a `promotion` instead of an `offer`) with
      // legacyFlyerItemIdMap: null, and the SDK crashes on `null.flyerItemIdMap` so nothing renders.
      // Give those promotions an empty map before the data is handed to the SDK.
      function normalizePublication(pub) {
        for (const section of pub.sections || []) {
          for (const atom of section.atoms || []) {
            if (atom.promotion && !atom.promotion.legacyFlyerItemIdMap) {
              atom.promotion.legacyFlyerItemIdMap = { flyerItemIdMap: {} };
            }
          }
        }
      }

      // The SDK (re)creates its iframes, so keep re-applying the nav bar tweak.
      setInterval(() => {
        const frame = document.querySelector("#flipp-container iframe.mainframe");
        const nav = document.querySelector("#flipp-container iframe.navframe");
        if (nav) hideSearchButton(nav);
      }, 250);

      // Remove the "Search" button from the Navigation Bar iframe.
      function hideSearchButton(frame) {
        let doc;
        try { doc = frame.contentDocument; } catch { return; }
        if (!doc || !doc.head || doc.getElementById("hide-search-style")) return;
        const style = doc.createElement("style");
        style.id = "hide-search-style";
        style.textContent = "#searchButton { display: none !important; }";
        doc.head.appendChild(style);
      }

      function resetContainer(message) {
        const fresh = document.createElement("div");
        fresh.id = "flipp-container";
        if (message) fresh.innerHTML = `<div class="empty"></div>`, fresh.firstChild.textContent = message;
        $("flipp-container").replaceWith(fresh);
        return fresh;
      }

      function waitForFlippSDK({ timeoutMs = 8000, pollMs = 50 } = {}) {
        const started = Date.now();
        return new Promise((resolve, reject) => {
          const t = setInterval(() => {
            if (window.Flipp && window.Flipp.Storefront) { clearInterval(t); resolve(); }
            else if (Date.now() - started > timeoutMs) { clearInterval(t); reject(new Error("Flipp SDK not available")); }
          }, pollMs);
        });
      }

      const log = (label) => (e) => console.log(label, e);
      const analyticsDelegate = {
        onEngagement: log("Engagement data:"),
        onItemClick: log("Item click data:"),
        onItemView: log("Item view data:"),
        onOpen: log("Open data:"),
        onFlyerView: log("Flyer view data:"),
      };

      async function loadFlyer() {
        const values = readInputs();

        const missing = ["globalId", "merchantId", "storeCode"].filter((f) => !values[f]);
        if (missing.length) {
          setStatus("err", `Missing URL parameter(s): ${missing.join(", ")}`);
          resetContainer("Add ?globalId=…&merchantId=…&storeCode=… to the URL (optional: templateUrl).");
          return;
        }

        const pubUrl = buildPublicationUrl(values);
        setStatus("", "Requesting flyer from Curator…");

        let pub, body;
        try {
          if (values.globalId === CURATOR_SNAPSHOT.publication.globalId) {
            body = JSON.parse(JSON.stringify(CURATOR_SNAPSHOT)); // embedded response; atoms are injected below
            pub = body.publication;
          } else {
            const resp = await fetch(pubUrl, { headers: { authorization: ACCESS_TOKEN } });
            body = await resp.json().catch(() => ({}));
            if (!resp.ok) throw new Error(`${resp.status}: ${body.error || body.message || resp.statusText}`);
            pub = body.publication;
            if (!pub || !pub.globalId) throw new Error("Response contained no publication");
          }
        } catch (e) {
          console.error(e);
          setStatus("err", "No flyer returned");
          resetContainer(`Curator did not return a flyer. ${e.message}`);
          return;
        }

        injectAtoms(pub, values);
        normalizePublication(pub);
        setStatus("", "Loading SDK…");

        try {
          await waitForFlippSDK();
        } catch (e) {
          setStatus("err", "Flipp SDK not available. Check network access to aq.flippenterprise.net.");
          return;
        }

        const nameIdentifier = merchantNameIdentifier || `merchant-${values.merchantId}`;
        try {
          window.__flyerRouting = await buildRouting(values, body, nameIdentifier);
        } catch (e) {
          console.error(e);
          setStatus("err", `Could not load merchant config: ${e.message}`);
          return;
        }
        const container = resetContainer();
        setStatus("", "Rendering…");

        try {
          const storefront = new Flipp.Storefront({
            accessToken: ACCESS_TOKEN,
            merchantId: values.merchantId,
            merchantNameIdentifier: nameIdentifier,
            storeCode: values.storeCode,
            flyerGlobalId: pub.globalId,
            analyticsDelegate,
          });
          storefront.renderStorefront(container);
          setStatus("", "");
        } catch (e) {
          console.error(e);
          setStatus("err", "Render failed. Open DevTools console for details.");
        }
      }

      window.addEventListener("load", loadFlyer);
    </script>
  </body>
</html>
